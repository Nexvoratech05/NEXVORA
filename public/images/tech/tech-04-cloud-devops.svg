<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" class="w-full h-full">
  <rect width="800" height="500" fill="#0C1F38" rx="12"/>
  <defs>
    <pattern id="techGrid4" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#162D4D" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#techGrid4)" rx="12"/>

  <!-- Top Window Title -->
  <rect x="30" y="24" width="740" height="38" rx="7" fill="#071426" stroke="#1B3558"/>
  <circle cx="54" cy="43" r="5" fill="#EF4444"/>
  <circle cx="70" cy="43" r="5" fill="#F59E0B"/>
  <circle cx="86" cy="43" r="5" fill="#10B981"/>
  <text x="400" y="47" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="0.04em" text-anchor="middle">Cloud Infrastructure &amp; DevOps CI/CD Flow</text>

  <!-- 4 Connected Component Boxes with Dotted Lines -->

  <!-- Box 1: GitHub Actions -->
  <g transform="translate(45, 110)">
    <rect width="140" height="180" rx="10" fill="#071426" stroke="#00D2FF" stroke-width="1.5"/>
    <rect x="25" y="20" width="90" height="75" rx="8" fill="#0C1F38" stroke="#162D4D"/>
    <!-- GitHub Workflow Icon -->
    <g transform="translate(56, 42)">
      <circle cx="14" cy="15" r="14" fill="#162D4D" stroke="#2088FF" stroke-width="2"/>
      <path d="M8 15 L12 19 L20 11" fill="none" stroke="#2088FF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="70" y="122" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">GitHub Actions</text>
    <text x="70" y="142" fill="#00D2FF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">CI/CD Pipeline</text>
    <text x="70" y="162" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Automated Test &amp; Lint</text>
  </g>

  <!-- Dotted Line 1 -> 2 -->
  <line x1="185" y1="200" x2="235" y2="200" stroke="#00D2FF" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="210" cy="200" r="4" fill="#00D2FF"/>

  <!-- Box 2: Docker Engine -->
  <g transform="translate(235, 110)">
    <rect width="140" height="180" rx="10" fill="#071426" stroke="#00D2FF" stroke-width="1.5"/>
    <rect x="25" y="20" width="90" height="75" rx="8" fill="#0C1F38" stroke="#162D4D"/>
    <!-- Docker Container 3D Cube Icon -->
    <g transform="translate(56, 42)">
      <polygon points="14,2 25,8 14,14 3,8" fill="#55B9FF" stroke="#00D2FF" stroke-width="1"/>
      <polygon points="3,8 14,14 14,26 3,20" fill="#087BCE" stroke="#00D2FF" stroke-width="1"/>
      <polygon points="25,8 14,14 14,26 25,20" fill="#162D4D" stroke="#00D2FF" stroke-width="1"/>
    </g>
    <text x="70" y="122" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Docker Engine</text>
    <text x="70" y="142" fill="#00D2FF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Containerization</text>
    <text x="70" y="162" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Multi-Stage Alpine</text>
  </g>

  <!-- Dotted Line 2 -> 3 -->
  <line x1="375" y1="200" x2="425" y2="200" stroke="#00D2FF" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="400" cy="200" r="4" fill="#00D2FF"/>

  <!-- Box 3: Terraform IaC -->
  <g transform="translate(425, 110)">
    <rect width="140" height="180" rx="10" fill="#071426" stroke="#00D2FF" stroke-width="1.5"/>
    <rect x="25" y="20" width="90" height="75" rx="8" fill="#0C1F38" stroke="#162D4D"/>
    <!-- Terraform Geometric Diamond Icon -->
    <g transform="translate(56, 42)">
      <polygon points="8,4 15,8 15,16 8,12" fill="#844FBA"/>
      <polygon points="16,8 23,12 23,20 16,16" fill="#5C4EE5"/>
      <polygon points="8,14 15,18 15,26 8,22" fill="#A855F7"/>
    </g>
    <text x="70" y="122" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Terraform</text>
    <text x="70" y="142" fill="#A855F7" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Infrastructure as Code</text>
    <text x="70" y="162" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Modular Cloud VPC</text>
  </g>

  <!-- Dotted Line 3 -> 4 -->
  <line x1="565" y1="200" x2="615" y2="200" stroke="#00D2FF" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="590" cy="200" r="4" fill="#00D2FF"/>

  <!-- Box 4: AWS & Azure Cloud -->
  <g transform="translate(615, 110)">
    <rect width="140" height="180" rx="10" fill="#071426" stroke="#00D2FF" stroke-width="1.5"/>
    <rect x="25" y="20" width="90" height="75" rx="8" fill="#0C1F38" stroke="#162D4D"/>
    <!-- Cloud Multi-AZ Icon -->
    <g transform="translate(52, 42)">
      <path d="M7 24 C2 24, 0 21, 0 17 C0 13, 4 10, 8 10 C9 5, 15 0, 22 0 C29 0, 34 5, 35 10 C38 10, 42 13, 42 18 C42 22, 38 24, 34 24 Z" fill="#162D4D" stroke="#F59E0B" stroke-width="1.5"/>
    </g>
    <text x="70" y="122" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">AWS &amp; Azure</text>
    <text x="70" y="142" fill="#10B981" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Zero-Downtime</text>
    <text x="70" y="162" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Multi-AZ Isolation</text>
  </g>

  <!-- Bottom Supported Stages Container -->
  <rect x="120" y="330" width="560" height="85" rx="9" fill="#071426" stroke="#1B3558"/>
  <text x="400" y="358" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em" text-anchor="middle">SUPPORTED CLOUD &amp; DEVOPS WORKFLOW STAGES</text>
  
  <g transform="translate(145, 372)">
    <rect x="0" y="0" width="115" height="26" rx="4" fill="#0C1F38" stroke="#00D2FF" stroke-width="0.8"/>
    <text x="57" y="17" fill="#00D2FF" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Vulnerability Scan</text>

    <rect x="130" y="0" width="115" height="26" rx="4" fill="#0C1F38" stroke="#10B981" stroke-width="0.8"/>
    <text x="187" y="17" fill="#10B981" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Blue-Green Rollout</text>

    <rect x="260" y="0" width="115" height="26" rx="4" fill="#0C1F38" stroke="#F59E0B" stroke-width="0.8"/>
    <text x="317" y="17" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">CloudWatch Traces</text>

    <rect x="390" y="0" width="115" height="26" rx="4" fill="#0C1F38" stroke="#00D2FF" stroke-width="0.8"/>
    <text x="447" y="17" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Edge CDN Protection</text>
  </g>

  <!-- Bottom Tagline -->
  <text x="400" y="455" fill="#64748B" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">AWS ECS &amp; Lambda • Azure Virtual Networks • Docker Multi-Stage • Cloudflare Security</text>
</svg>