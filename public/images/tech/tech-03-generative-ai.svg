<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" class="w-full h-full">
  <rect width="800" height="500" fill="#0C1F38" rx="12"/>
  <defs>
    <pattern id="techGrid3" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#162D4D" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="agentStarG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="70%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#0C1F38" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#techGrid3)" rx="12"/>

  <!-- Top Window Title (exact match with user's Card 3: AI Data Scientist Agent) -->
  <rect x="30" y="24" width="740" height="38" rx="7" fill="#071426" stroke="#1B3558"/>
  <circle cx="54" cy="43" r="5" fill="#EF4444"/>
  <circle cx="70" cy="43" r="5" fill="#F59E0B"/>
  <circle cx="86" cy="43" r="5" fill="#10B981"/>
  <text x="400" y="47" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="0.04em" text-anchor="middle">AI Data Scientist &amp; Autonomous Agent Workflow</text>

  <!-- 4 Connected Component Boxes with Dotted Lines (Exact match with user's Card 3!) -->

  <!-- Box 1: Dataset (Document Icon) -->
  <g transform="translate(45, 110)">
    <rect width="140" height="180" rx="10" fill="#071426" stroke="#00D2FF" stroke-width="1.5"/>
    <!-- Icon Container -->
    <rect x="25" y="20" width="90" height="75" rx="8" fill="#0C1F38" stroke="#162D4D"/>
    <!-- Document Icon (exact match with user's Card 3) -->
    <g transform="translate(56, 38)">
      <rect width="28" height="38" rx="3" fill="#162D4D" stroke="#00D2FF" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="22" y2="12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="20" x2="22" y2="20" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="6" y1="28" x2="16" y2="28" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <text x="70" y="122" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Dataset</text>
    <text x="70" y="142" fill="#00D2FF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">pgvector / Corpus</text>
    <text x="70" y="162" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Semantic Chunks</text>
  </g>

  <!-- Dotted Connector Line 1 -> 2 -->
  <line x1="185" y1="200" x2="235" y2="200" stroke="#00D2FF" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="210" cy="200" r="4" fill="#00D2FF"/>

  <!-- Box 2: Agent Workflow (Glowing 8-Point Star Icon - Exact match with user's Card 3!) -->
  <g transform="translate(235, 110)">
    <rect width="140" height="180" rx="10" fill="#071426" stroke="#00D2FF" stroke-width="1.5"/>
    <!-- Icon Container -->
    <rect x="25" y="20" width="90" height="75" rx="8" fill="#0C1F38" stroke="#162D4D"/>
    <!-- Glowing 8-Point Cyan Agent Star -->
    <g transform="translate(70, 57)">
      <circle cx="0" cy="0" r="24" fill="url(#agentStarG)"/>
      <path d="M0 -18 L3 -5 L16 -1 L5 4 L8 17 L-1 8 L-10 14 L-6 2 L-18 -2 L-6 -6 Z" fill="#00D2FF"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    </g>
    
    <text x="70" y="122" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Agent Workflow</text>
    <text x="70" y="142" fill="#00D2FF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Multi-Agent Loops</text>
    <text x="70" y="162" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Dynamic Tool Calls</text>
  </g>

  <!-- Dotted Connector Line 2 -> 3 -->
  <line x1="375" y1="200" x2="425" y2="200" stroke="#00D2FF" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="400" cy="200" r="4" fill="#00D2FF"/>

  <!-- Box 3: Insights (Cyan Bar Chart Icon - Exact match with user's Card 3!) -->
  <g transform="translate(425, 110)">
    <rect width="140" height="180" rx="10" fill="#071426" stroke="#00D2FF" stroke-width="1.5"/>
    <!-- Icon Container -->
    <rect x="25" y="20" width="90" height="75" rx="8" fill="#0C1F38" stroke="#162D4D"/>
    <!-- Cyan Vertical Bar Chart Graphic (exact match with user's Card 3) -->
    <g transform="translate(54, 40)">
      <rect x="3" y="14" width="5" height="20" fill="#00D2FF" rx="1.5"/>
      <rect x="11" y="6" width="5" height="28" fill="#00D2FF" rx="1.5"/>
      <rect x="19" y="18" width="5" height="16" fill="#00D2FF" rx="1.5"/>
      <rect x="27" y="2" width="5" height="32" fill="#00D2FF" rx="1.5"/>
    </g>
    
    <text x="70" y="122" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Insights</text>
    <text x="70" y="142" fill="#00D2FF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Cross-Encoders</text>
    <text x="70" y="162" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Verified Citations</text>
  </g>

  <!-- Dotted Connector Line 3 -> 4 -->
  <line x1="565" y1="200" x2="615" y2="200" stroke="#00D2FF" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="590" cy="200" r="4" fill="#00D2FF"/>

  <!-- Box 4: Report (Folded Sheet Icon - Exact match with user's Card 3!) -->
  <g transform="translate(615, 110)">
    <rect width="140" height="180" rx="10" fill="#071426" stroke="#00D2FF" stroke-width="1.5"/>
    <!-- Icon Container -->
    <rect x="25" y="20" width="90" height="75" rx="8" fill="#0C1F38" stroke="#162D4D"/>
    <!-- Folded Document Report Icon -->
    <g transform="translate(56, 38)">
      <path d="M0 0 H20 L28 8 V38 H0 Z" fill="#162D4D" stroke="#FFFFFF" stroke-width="1.5"/>
      <path d="M20 0 V8 H28" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="6" y1="16" x2="22" y2="16" stroke="#00D2FF" stroke-width="1.5"/>
      <line x1="6" y1="22" x2="22" y2="22" stroke="#00D2FF" stroke-width="1.5"/>
      <line x1="6" y1="28" x2="16" y2="28" stroke="#00D2FF" stroke-width="1.5"/>
    </g>
    
    <text x="70" y="122" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Report</text>
    <text x="70" y="142" fill="#10B981" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Structured JSON</text>
    <text x="70" y="162" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Private VPC Output</text>
  </g>

  <!-- Bottom Supported Stages Container (Exact match with user's Card 3!) -->
  <rect x="120" y="330" width="560" height="85" rx="9" fill="#071426" stroke="#1B3558"/>
  <text x="400" y="358" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em" text-anchor="middle">SUPPORTED ANALYTICAL STAGES</text>
  <text x="400" y="388" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Profiling • EDA • Preprocessing • Visualization • Reporting</text>

  <!-- Bottom Tagline -->
  <text x="400" y="455" fill="#64748B" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">OpenAI &amp; Google Gemini APIs • LangChain Core • LlamaIndex • pgvector • Pinecone Indexing</text>
</svg>