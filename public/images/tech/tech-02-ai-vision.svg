<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" class="w-full h-full">
  <rect width="800" height="500" fill="#0C1F38" rx="12"/>
  <defs>
    <pattern id="techGrid2" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#162D4D" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="heatRadialTech" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#0C1F38" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#techGrid2)" rx="12"/>

  <!-- Top Window Title (exact match with user uploaded image Card 1) -->
  <rect x="30" y="24" width="740" height="38" rx="7" fill="#071426" stroke="#1B3558"/>
  <circle cx="54" cy="43" r="5" fill="#EF4444"/>
  <circle cx="70" cy="43" r="5" fill="#F59E0B"/>
  <circle cx="86" cy="43" r="5" fill="#10B981"/>
  <text x="400" y="47" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="0.04em" text-anchor="middle">Deep Learning &amp; Computer Vision Analysis</text>

  <!-- 3-Panel Visual Layout (Exact match with user's Card 1) -->
  
  <!-- Panel 1: Optical / Radiograph Contour Image -->
  <g transform="translate(60, 95)">
    <rect width="190" height="235" rx="10" fill="#071426" stroke="#00D2FF" stroke-width="1.5"/>
    <!-- Joint Contour Silhouette (matching Card 1) -->
    <g transform="translate(35, 30)">
      <path d="M25 15 C40 15, 50 25, 50 55 C50 72, 40 78, 30 85 C40 92, 50 98, 50 115 C50 145, 40 155, 25 155" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M95 15 C80 15, 70 25, 70 55 C70 72, 80 78, 90 85 C80 92, 70 98, 70 115 C70 145, 80 155, 95 155" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Glowing Joint Gap Target -->
      <ellipse cx="60" cy="85" rx="20" ry="10" fill="#00D2FF" fill-opacity="0.4" stroke="#00D2FF" stroke-width="2"/>
      <circle cx="60" cy="85" r="4" fill="#00D2FF"/>
    </g>
    <text x="95" y="215" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">DICOM Radiograph / OpenCV</text>
  </g>

  <!-- Panel 2: KL SEVERITY Classification Box (Exact match with user's Card 1) -->
  <g transform="translate(285, 95)">
    <rect width="210" height="235" rx="10" fill="#071426" stroke="#00D2FF" stroke-width="1.5"/>
    <text x="105" y="40" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.05em" text-anchor="middle">KL SEVERITY</text>
    
    <!-- Active Selected Badge -->
    <rect x="25" y="65" width="160" height="42" rx="6" fill="#087BCE"/>
    <text x="105" y="91" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">KL2 — Moderate</text>

    <!-- Alternative Scale Bars -->
    <rect x="25" y="120" width="160" height="26" rx="5" fill="#0C1F38" stroke="#162D4D"/>
    <text x="105" y="137" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">KL1 — Doubtful</text>

    <rect x="25" y="155" width="160" height="26" rx="5" fill="#0C1F38" stroke="#162D4D"/>
    <text x="105" y="172" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">KL3 — Severe</text>

    <text x="105" y="215" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">98.4% Confidence</text>
  </g>

  <!-- Panel 3: MODEL EXPLAINABILITY Grad-CAM Radar (Exact match with user's Card 1) -->
  <g transform="translate(530, 95)">
    <rect width="210" height="235" rx="10" fill="#071426" stroke="#00D2FF" stroke-width="1.5"/>
    <text x="105" y="40" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.05em" text-anchor="middle">MODEL EXPLAINABILITY</text>

    <!-- Concentric Grad-CAM Attention Radar -->
    <g transform="translate(105, 115)">
      <circle cx="0" cy="0" r="48" fill="url(#heatRadialTech)"/>
      <circle cx="0" cy="0" r="48" fill="none" stroke="#162D4D" stroke-width="1"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 2"/>
      <circle cx="0" cy="0" r="16" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Grad-CAM Label Badge -->
    <rect x="35" y="185" width="140" height="28" rx="5" fill="#0C1F38" stroke="#F59E0B" stroke-width="1"/>
    <text x="105" y="203" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Grad-CAM Attention</text>
  </g>

  <!-- Bottom Supported Stages Container (matching user's Card 1) -->
  <rect x="120" y="355" width="560" height="65" rx="9" fill="#071426" stroke="#1B3558"/>
  <text x="400" y="380" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em" text-anchor="middle">SUPPORTED ANALYTICAL STAGES</text>
  <text x="400" y="404" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">X-ray Preprocessing • Model Comparison • KL0-KL4 • Explainability</text>

  <!-- Bottom Tagline -->
  <text x="400" y="455" fill="#64748B" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">PyTorch &amp; TensorFlow • ResNet-50 • Vision Transformers (ViT) • FastAPI GPU Serving</text>
</svg>