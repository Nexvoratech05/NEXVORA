<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" className="w-full h-full">
  <rect width="800" height="500" fill="#0C1F38" rx="12"/>
  <defs>
    <pattern id="cloudGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1B3558" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#087BCE"/>
      <stop offset="100%" stop-color="#55B9FF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#cloudGrid)" rx="12"/>

  <!-- Diagram Title / Header -->
  <rect x="40" y="30" width="720" height="40" rx="6" fill="#071426" stroke="#1B3558"/>
  <circle cx="65" cy="50" r="5" fill="#55B9FF"/>
  <circle cx="82" cy="50" r="5" fill="#087BCE"/>
  <circle cx="99" cy="50" r="5" fill="#1F9D6B"/>
  <text x="120" y="55" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="0.05em">AWS HIGH-AVAILABILITY CLOUD TOPOLOGY &amp; VPC SUBNET ARCHITECTURE</text>

  <!-- External Users & Cloudflare WAF -->
  <rect x="50" y="120" width="120" height="90" rx="8" fill="#071426" stroke="#087BCE" stroke-width="1.5"/>
  <text x="110" y="155" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Internet / Users</text>
  <text x="110" y="175" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">HTTPS / TLS 1.3</text>
  <path d="M110 210 L110 250" stroke="#55B9FF" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Cloudflare Edge WAF -->
  <rect x="50" y="250" width="120" height="90" rx="8" fill="#071426" stroke="#55B9FF" stroke-width="1.5"/>
  <text x="110" y="285" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cloudflare Edge</text>
  <text x="110" y="305" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">DDoS / WAF / CDN</text>

  <!-- Arrow to VPC -->
  <path d="M170 295 L220 295" stroke="#55B9FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AWS VPC Enclosure -->
  <rect x="220" y="100" width="540" height="360" rx="10" fill="#071426" fill-opacity="0.8" stroke="#1B3558" stroke-width="1.5"/>
  <rect x="235" y="115" width="130" height="24" rx="4" fill="#1B3558"/>
  <text x="300" y="131" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">AWS VPC (Multi-AZ)</text>

  <!-- Application Load Balancer -->
  <rect x="250" y="240" width="110" height="110" rx="8" fill="#0C1F38" stroke="#087BCE" stroke-width="1.5"/>
  <text x="305" y="285" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">AWS ALB</text>
  <text x="305" y="305" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">SSL Termination</text>
  <text x="305" y="322" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Health Checks</text>

  <!-- Connectors to ECS Tasks -->
  <path d="M360 280 L420 200" stroke="#087BCE" stroke-width="1.5"/>
  <path d="M360 310 L420 370" stroke="#087BCE" stroke-width="1.5"/>

  <!-- AZ-A Private Subnet -->
  <rect x="420" y="150" width="160" height="110" rx="6" fill="#0C1F38" stroke="#1B3558"/>
  <text x="500" y="175" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">AZ-A Private Subnet</text>
  <rect x="435" y="190" width="130" height="50" rx="4" fill="#071426" stroke="#087BCE"/>
  <text x="500" y="212" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">ECS Task App 1</text>
  <text x="500" y="228" fill="#1F9D6B" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Status: Healthy</text>

  <!-- AZ-B Private Subnet -->
  <rect x="420" y="320" width="160" height="110" rx="6" fill="#0C1F38" stroke="#1B3558"/>
  <text x="500" y="345" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">AZ-B Private Subnet</text>
  <rect x="435" y="360" width="130" height="50" rx="4" fill="#071426" stroke="#087BCE"/>
  <text x="500" y="382" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">ECS Task App 2</text>
  <text x="500" y="398" fill="#1F9D6B" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Status: Healthy</text>

  <!-- Connectors to Database -->
  <path d="M580 215 L620 260" stroke="#55B9FF" stroke-width="1.5"/>
  <path d="M580 385 L620 300" stroke="#55B9FF" stroke-width="1.5"/>

  <!-- RDS Multi-AZ Database -->
  <rect x="620" y="215" width="120" height="135" rx="8" fill="#0C1F38" stroke="#1F9D6B" stroke-width="1.5"/>
  <text x="680" y="250" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">RDS Aurora / PG</text>
  <text x="680" y="270" fill="#1F9D6B" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Multi-AZ Standby</text>
  <text x="680" y="295" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Encrypted at Rest</text>
  <text x="680" y="320" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Automated Backups</text>
</svg>

