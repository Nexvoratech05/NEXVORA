  <g transform="translate(57, 318)">
    <circle cx="11" cy="11" r="9" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 4"/>
    <path d="M17 11 L20 14 L20 8 Z" fill="#F59E0B"/>
  </g>
  <text x="92" y="326" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">REST APIs</text>
  <text x="92" y="341" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9">Batch Webhooks</text>

  <!-- Data Flow Conduits -->
  <path d="M210 227 L250 227" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="230" cy="227" r="4" fill="#00D2FF"/>

  <!-- Center: Databricks Medallion Engine -->
  <rect x="250" y="80" width="300" height="295" rx="10" fill="#071426" stroke="#00D2FF" stroke-width="1.5"/>
  <text x="400" y="108" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">DATABRICKS DELTA LAKEHOUSE</text>

  <!-- Medallion Layer 1: Bronze Cylinder Graphic -->
  <g transform="translate(270, 130)">
    <rect width="260" height="52" rx="7" fill="#0C1F38" stroke="#CD7F32" stroke-width="1.5"/>
    <!-- 3D Bronze Cylinder -->
    <ellipse cx="26" cy="18" rx="14" ry="6" fill="#E59866" stroke="#BA4A00" stroke-width="1"/>
    <path d="M12 18 v16 c0 3.3 6.3 6 14 6 s14 -2.7 14 -6 v-16" fill="url(#bronzeGrad)" stroke="#BA4A00" stroke-width="1"/>
    <ellipse cx="26" cy="34" rx="14" ry="6" fill="none" stroke="#E59866" stroke-width="0.8"/>
    <text x="50" y="24" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">BRONZE LAYER (RAW DATA)</text>
    <text x="50" y="40" fill="#E59866" font-family="'Inter', sans-serif" font-size="9">Append-Only Ingestion • Schema Validation</text>
  </g>

  <!-- Arrow Down -->
  <path d="M400 184 L400 196" stroke="#00D2FF" stroke-width="2" stroke-linecap="round"/>
  <polygon points="400,200 396,194 404,194" fill="#00D2FF"/>

  <!-- Medallion Layer 2: Silver Cylinder Graphic -->
  <g transform="translate(270, 202)">
    <rect width="260" height="52" rx="7" fill="#0C1F38" stroke="#BDC3C7" stroke-width="1.5"/>
    <!-- 3D Silver Cylinder -->
    <ellipse cx="26" cy="18" rx="14" ry="6" fill="#F2F4F4" stroke="#7F8C8D" stroke-width="1"/>
    <path d="M12 18 v16 c0 3.3 6.3 6 14 6 s14 -2.7 14 -6 v-16" fill="url(#silverGrad)" stroke="#7F8C8D" stroke-width="1"/>
    <ellipse cx="26" cy="34" rx="14" ry="6" fill="none" stroke="#F2F4F4" stroke-width="0.8"/>
    <text x="50" y="24" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">SILVER LAYER (CLEANSED)</text>
    <text x="50" y="40" fill="#BDC3C7" font-family="'Inter', sans-serif" font-size="9">PySpark Deduplication • Conformed Schemas</text>
  </g>

  <!-- Arrow Down -->
  <path d="M400 256 L400 268" stroke="#00D2FF" stroke-width="2" stroke-linecap="round"/>
  <polygon points="400,272 396,266 404,266" fill="#00D2FF"/>

  <!-- Medallion Layer 3: Gold Cylinder Graphic -->
  <g transform="translate(270, 274)">
    <rect width="260" height="52" rx="7" fill="#0C1F38" stroke="#F39C12" stroke-width="1.5"/>
    <!-- 3D Gold Cylinder -->
    <ellipse cx="26" cy="18" rx="14" ry="6" fill="#F9E79F" stroke="#B9770E" stroke-width="1"/>
    <path d="M12 18 v16 c0 3.3 6.3 6 14 6 s14 -2.7 14 -6 v-16" fill="url(#goldGrad)" stroke="#B9770E" stroke-width="1"/>
    <ellipse cx="26" cy="34" rx="14" ry="6" fill="none" stroke="#F9E79F" stroke-width="0.8"/>
    <text x="50" y="24" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">GOLD LAYER (AGGREGATES)</text>
    <text x="50" y="40" fill="#F9E79F" font-family="'Inter', sans-serif" font-size="9">Star Schemas • High-Speed BI Marts</text>
  </g>

  <!-- Unity Catalog Lineage Bar -->
  <rect x="270" y="336" width="260" height="26" rx="5" fill="#162D4D" stroke="#00D2FF" stroke-width="0.8"/>
  <text x="400" y="353" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">⚡ Unity Catalog Governance &amp; Lineage</text>

  <!-- Conduit to Analytics -->
  <path d="M550 227 L590 227" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="570" cy="227" r="4" fill="#00D2FF"/>

