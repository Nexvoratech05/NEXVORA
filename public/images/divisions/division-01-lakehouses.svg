  <rect x="605" y="130" width="150" height="66" rx="6" fill="#0C1F38" stroke="#F59E0B"/>
  <g transform="translate(615, 142)">
    <!-- Mini Bar Chart -->
    <rect x="2" y="18" width="6" height="20" fill="#F59E0B" rx="1"/>
    <rect x="11" y="10" width="6" height="28" fill="#FCD34D" rx="1"/>
    <rect x="20" y="4" width="6" height="34" fill="#F59E0B" rx="1"/>
    <rect x="29" y="14" width="6" height="24" fill="#00D2FF" rx="1"/>
  </g>
  <text x="658" y="156" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Power BI</text>
  <text x="658" y="172" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="9">Executive KPIs</text>
  <text x="658" y="186" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8">Auto-Refresh</text>

  <!-- SQL Endpoint Card -->
  <rect x="605" y="208" width="150" height="66" rx="6" fill="#0C1F38" stroke="#00D2FF"/>
  <g transform="translate(615, 222)">
    <!-- Terminal / SQL Code Icon -->
    <rect x="0" y="0" width="34" height="26" rx="3" fill="#162D4D" stroke="#00D2FF" stroke-width="1"/>
    <text x="4" y="16" fill="#00D2FF" font-family="monospace" font-size="11">&gt;_</text>
  </g>
  <text x="658" y="234" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">SQL Warehouses</text>
  <text x="658" y="250" fill="#00D2FF" font-family="'Inter', sans-serif" font-size="9">Sub-Second Queries</text>
  <text x="658" y="264" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8">Serverless Compute</text>

  <!-- ML Feature Store Card -->
  <rect x="605" y="286" width="150" height="66" rx="6" fill="#0C1F38" stroke="#10B981"/>
  <g transform="translate(615, 300)">
    <!-- AI Brain / Graph Icon -->
    <circle cx="16" cy="14" r="10" fill="#162D4D" stroke="#10B981" stroke-width="1"/>
    <circle cx="16" cy="14" r="3" fill="#10B981"/>
    <circle cx="10" cy="9" r="2" fill="#55B9FF"/>
    <circle cx="22" cy="9" r="2" fill="#55B9FF"/>
  </g>
  <text x="658" y="312" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">ML Features</text>
  <text x="658" y="328" fill="#10B981" font-family="'Inter', sans-serif" font-size="9">Model Training</text>
  <text x="658" y="342" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8">Feature Store Hub</text>

  <!-- Bottom Capability Badges -->
  <rect x="30" y="395" width="740" height="80" rx="8" fill="#071426" stroke="#1B3558"/>
  <text x="50" y="420" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">CORE DIVISION TECHNOLOGIES &amp; PROTOCOLS:</text>

  <rect x="50" y="432" width="130" height="26" rx="5" fill="#0C1F38" stroke="#00D2FF"/>
  <text x="115" y="449" fill="#00D2FF" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Apache Spark / PySpark</text>

  <rect x="195" y="432" width="130" height="26" rx="5" fill="#0C1F38" stroke="#F59E0B"/>
  <text x="260" y="449" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Databricks Delta Lake</text>

  <rect x="340" y="432" width="130" height="26" rx="5" fill="#0C1F38" stroke="#10B981"/>
  <text x="405" y="449" fill="#10B981" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Medallion Architecture</text>

  <rect x="485" y="432" width="130" height="26" rx="5" fill="#0C1F38" stroke="#00D2FF"/>
  <text x="550" y="449" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Unity Catalog Lineage</text>

  <rect x="630" y="432" width="125" height="26" rx="5" fill="#0C1F38" stroke="#F59E0B"/>
  <text x="692" y="449" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Power BI Analytics</text>
</svg>