<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" class="w-full h-full">
  <rect width="800" height="500" fill="#0C1F38" rx="12"/>
  <defs>
    <pattern id="diagGrid1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1B3558" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="bronzeG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
    <linearGradient id="silverG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#diagGrid1)" rx="12"/>

  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="40" rx="6" fill="#071426" stroke="#1B3558"/>
  <circle cx="65" cy="50" r="5" fill="#EF4444"/>
  <circle cx="82" cy="50" r="5" fill="#F59E0B"/>
  <circle cx="99" cy="50" r="5" fill="#10B981"/>
  <text x="120" y="55" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="0.05em">DIVISION 01 — DATA ENGINEERING &amp; MEDALLION LAKEHOUSE</text>

  <!-- Sources Column -->
  <rect x="40" y="100" width="170" height="270" rx="8" fill="#071426" stroke="#1B3558"/>
  <text x="125" y="125" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">INGESTION SOURCES</text>

  <rect x="55" y="145" width="140" height="42" rx="5" fill="#0C1F38" stroke="#1B3558"/>
  <text x="125" y="165" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Kafka Streams</text>
  <text x="125" y="178" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">Event-Driven Telemetry</text>

  <rect x="55" y="200" width="140" height="42" rx="5" fill="#0C1F38" stroke="#1B3558"/>
  <text x="125" y="220" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Cloud Storage S3/ADLS</text>
  <text x="125" y="233" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">Auto Loader File Ingestion</text>

  <rect x="55" y="255" width="140" height="42" rx="5" fill="#0C1F38" stroke="#1B3558"/>
  <text x="125" y="275" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">OLTP Databases</text>
  <text x="125" y="288" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">PostgreSQL / MySQL CDC</text>

  <rect x="55" y="310" width="140" height="42" rx="5" fill="#0C1F38" stroke="#1B3558"/>
  <text x="125" y="330" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">REST APIs &amp; Webhooks</text>
  <text x="125" y="343" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">Batch Ingestion Schedules</text>

  <!-- Connectors -->
  <path d="M210 235 L260 235" stroke="#55B9FF" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Medallion Lakehouse Engine -->
  <rect x="260" y="100" width="280" height="270" rx="10" fill="#071426" stroke="#087BCE" stroke-width="1.5"/>
  <text x="400" y="125" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">DATABRICKS DELTA LAKEHOUSE</text>

  <!-- Bronze Layer -->
  <rect x="280" y="145" width="240" height="48" rx="6" fill="#0C1F38" stroke="#CD7F32" stroke-width="1.5"/>
  <circle cx="300" cy="169" r="6" fill="#CD7F32"/>
  <text x="315" y="165" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700">BRONZE (Raw Storage)</text>
  <text x="315" y="180" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9">Append-Only Parquet • ACID Audit Logs</text>

  <!-- Flow Arrow -->
  <path d="M400 193 L400 203" stroke="#087BCE" stroke-width="2"/>

  <!-- Silver Layer -->
  <rect x="280" y="205" width="240" height="48" rx="6" fill="#0C1F38" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="300" cy="229" r="6" fill="#E2E8F0"/>
  <text x="315" y="225" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700">SILVER (Cleansed &amp; Conformed)</text>
  <text x="315" y="240" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9">Deduplicated • PySpark Transformations</text>

  <!-- Flow Arrow -->
  <path d="M400 253 L400 263" stroke="#087BCE" stroke-width="2"/>

  <!-- Gold Layer -->
  <rect x="280" y="265" width="240" height="48" rx="6" fill="#0C1F38" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="300" cy="289" r="6" fill="#FCD34D"/>
  <text x="315" y="285" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700">GOLD (Curated Aggregates)</text>
  <text x="315" y="300" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9">Star/Snowflake Schemas • Sub-Second Latency</text>

  <!-- Unity Catalog Bar -->
  <rect x="280" y="325" width="240" height="30" rx="4" fill="#1B3558"/>
  <text x="400" y="344" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Unity Catalog Governance &amp; Data Lineage</text>

  <!-- Connector to Serving -->
  <path d="M540 235 L590 235" stroke="#55B9FF" stroke-width="2" stroke-dasharray="4 2"/>

