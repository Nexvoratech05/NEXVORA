<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" class="w-full h-full">
  <rect width="800" height="500" fill="#0C1F38" rx="12"/>
  <defs>
    <pattern id="grid1" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#162D4D" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="bronzeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E59866"/>
      <stop offset="50%" stop-color="#BA4A00"/>
      <stop offset="100%" stop-color="#6E2C00"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F4F4"/>
      <stop offset="50%" stop-color="#BDC3C7"/>
      <stop offset="100%" stop-color="#7F8C8D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9E79F"/>
      <stop offset="50%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#B9770E"/>
    </linearGradient>
    <linearGradient id="cyanSpark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grid1)" rx="12"/>

  <!-- Window Header -->
  <rect x="30" y="24" width="740" height="38" rx="7" fill="#071426" stroke="#1B3558"/>
  <circle cx="54" cy="43" r="5" fill="#EF4444"/>
  <circle cx="70" cy="43" r="5" fill="#F59E0B"/>
  <circle cx="86" cy="43" r="5" fill="#10B981"/>
  <text x="110" y="47" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="0.05em">DATA ENGINEERING &amp; MEDALLION LAKEHOUSE PIPELINE</text>

  <!-- Left: Ingestion Sources with Visual Icons -->
  <rect x="30" y="80" width="180" height="295" rx="10" fill="#071426" stroke="#1B3558"/>
  <text x="120" y="108" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">INGESTION SOURCES</text>

  <!-- Kafka Stream Icon Card -->
  <rect x="45" y="125" width="150" height="50" rx="6" fill="#0C1F38" stroke="#1B3558"/>
  <!-- Kafka Logo Symbol -->
  <circle cx="68" cy="150" r="12" fill="#162D4D" stroke="#00D2FF" stroke-width="1.5"/>
  <circle cx="68" cy="150" r="4" fill="#00D2FF"/>
  <path d="M68 142 L68 138 M76 146 L80 144 M74 156 L78 159 M62 156 L58 159 M60 146 L56 144" stroke="#00D2FF" stroke-width="1.5" stroke-linecap="round"/>
  <text x="92" y="146" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Kafka Streams</text>
  <text x="92" y="161" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9">Real-Time Events</text>

  <!-- Database CDC Icon Card -->
  <rect x="45" y="185" width="150" height="50" rx="6" fill="#0C1F38" stroke="#1B3558"/>
  <!-- Database Icon -->
  <g transform="translate(56, 195)">
    <ellipse cx="12" cy="6" rx="10" ry="4" fill="#162D4D" stroke="#55B9FF" stroke-width="1.2"/>
    <path d="M2 6 v12 c0 2.2 4.5 4 10 4 s10 -1.8 10 -4 v-12" fill="none" stroke="#55B9FF" stroke-width="1.2"/>
    <path d="M2 12 c0 2.2 4.5 4 10 4 s10 -1.8 10 -4" fill="none" stroke="#55B9FF" stroke-width="1.2"/>
  </g>
  <text x="92" y="206" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Databases CDC</text>
  <text x="92" y="221" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9">Postgres / MySQL</text>

  <!-- Cloud Storage S3 Icon Card -->
  <rect x="45" y="245" width="150" height="50" rx="6" fill="#0C1F38" stroke="#1B3558"/>
  <!-- Cloud Storage Bucket Icon -->
  <g transform="translate(56, 255)">
    <path d="M3 7 L6 20 C6.5 22 17.5 22 18 20 L21 7 Z" fill="#162D4D" stroke="#10B981" stroke-width="1.2"/>
    <ellipse cx="12" cy="7" rx="9" ry="3" fill="#1B3558" stroke="#10B981" stroke-width="1.2"/>
  </g>
  <text x="92" y="266" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Cloud Storage</text>
  <text x="92" y="281" fill="#10B981" font-family="'Inter', sans-serif" font-size="9">S3 / ADLS AutoLoader</text>

  <!-- Batch API Icon Card -->
  <rect x="45" y="305" width="150" height="50" rx="6" fill="#0C1F38" stroke="#1B3558"/>
