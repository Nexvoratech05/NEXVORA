<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" class="w-full h-full">
  <rect width="800" height="500" fill="#0C1F38" rx="12"/>
  <defs>
    <pattern id="grid5" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#162D4D" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid5)" rx="12"/>

  <!-- Window Header -->
  <rect x="30" y="24" width="740" height="38" rx="7" fill="#071426" stroke="#1B3558"/>
  <circle cx="54" cy="43" r="5" fill="#EF4444"/>
  <circle cx="70" cy="43" r="5" fill="#F59E0B"/>
  <circle cx="86" cy="43" r="5" fill="#10B981"/>
  <text x="110" y="47" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="0.05em">SOFTWARE &amp; API ENGINEERING ARCHITECTURE</text>

  <!-- Left: Next.js & Frontend Client with Monitor UI Graphic -->
  <rect x="30" y="80" width="180" height="295" rx="10" fill="#071426" stroke="#1B3558"/>
  <text x="120" y="108" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">CLIENT PLATFORMS</text>

  <!-- Desktop Browser Monitor Graphic -->
  <g transform="translate(45, 125)">
    <rect width="150" height="110" rx="7" fill="#0C1F38" stroke="#00D2FF" stroke-width="1.2"/>
    <!-- Browser Top Bar -->
    <rect width="150" height="18" rx="6" fill="#162D4D"/>
    <circle cx="10" cy="9" r="2.5" fill="#EF4444"/>
    <circle cx="18" cy="9" r="2.5" fill="#F59E0B"/>
    <circle cx="26" cy="9" r="2.5" fill="#10B981"/>
    <!-- Code Blocks inside Screen -->
    <text x="10" y="38" fill="#00D2FF" font-family="monospace" font-size="9">&lt;NextAppRouter&gt;</text>
    <rect x="18" y="46" width="60" height="10" rx="2" fill="#087BCE"/>
    <rect x="18" y="60" width="85" height="10" rx="2" fill="#1B3558"/>
    <rect x="18" y="74" width="45" height="10" rx="2" fill="#10B981"/>
    <text x="10" y="98" fill="#00D2FF" font-family="monospace" font-size="9">&lt;/TypeScript&gt;</text>
  </g>

  <!-- Frontend Spec Card -->
  <rect x="45" y="248" width="150" height="112" rx="7" fill="#0C1F38" stroke="#1B3558"/>
  <text x="56" y="270" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">TypeScript Strict</text>
  <text x="56" y="286" fill="#00D2FF" font-family="'Inter', sans-serif" font-size="9">React 18 + Tailwind UI</text>
  <text x="56" y="312" fill="#10B981" font-family="'Inter', sans-serif" font-size="9">Server Components (RSC)</text>
  <text x="56" y="328" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8">SSR • Streaming • Caching</text>
  <text x="56" y="348" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="8">Core Web Vitals 99+</text>

  <!-- Connector -->
  <path d="M210 227 L250 227" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="230" cy="227" r="4" fill="#00D2FF"/>

  <!-- Center: High-Concurrency FastAPI Microservices Engine -->
  <rect x="250" y="80" width="300" height="295" rx="10" fill="#071426" stroke="#00D2FF" stroke-width="1.5"/>
  <text x="400" y="108" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">FASTAPI ASYNC MICROSERVICES</text>

  <!-- OpenAPI Contract Gateway Graphic -->
  <g transform="translate(270, 125)">
    <rect width="260" height="95" rx="8" fill="#0C1F38" stroke="#087BCE" stroke-width="1.2"/>
    <!-- API Router Symbol -->
    <rect x="15" y="15" width="40" height="40" rx="6" fill="#162D4D" stroke="#00D2FF" stroke-width="1.5"/>
    <text x="23" y="38" fill="#00D2FF" font-family="'Inter', sans-serif" font-size="11" font-weight="800">API</text>
    
    <text x="68" y="28" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Contract-First OpenAPI 3.1</text>
    <text x="68" y="44" fill="#00D2FF" font-family="'Inter', sans-serif" font-size="9">Pydantic v2 &amp; Zod Validation</text>
    <text x="68" y="58" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8">Strict Schema Enforcement</text>

    <!-- Method Badges -->
    <rect x="15" y="65" width="45" height="18" rx="3" fill="#10B981"/>
    <text x="37" y="77" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">GET</text>

    <rect x="68" y="65" width="45" height="18" rx="3" fill="#087BCE"/>
    <text x="90" y="77" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">POST</text>

    <rect x="121" y="65" width="45" height="18" rx="3" fill="#F59E0B"/>
    <text x="143" y="77" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">PUT</text>

    <rect x="174" y="65" width="45" height="18" rx="3" fill="#EF4444"/>
    <text x="196" y="77" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">DELETE</text>
  </g>

  <!-- Async Concurrency & Redis Layer -->
  <g transform="translate(270, 230)">
    <rect width="260" height="54" rx="7" fill="#0C1F38" stroke="#10B981" stroke-width="1.2"/>
    <!-- Lightning Concurrency Bolt -->
    <circle cx="28" cy="27" r="14" fill="#162D4D" stroke="#10B981" stroke-width="1"/>
    <path d="M29 17 L21 28 H28 L27 37 L35 25 H28 Z" fill="#10B981"/>
    <text x="50" y="24" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Non-Blocking Async Event Loop</text>
    <text x="50" y="40" fill="#10B981" font-family="'Inter', sans-serif" font-size="9">10k+ Concurrent Requests/sec • Uvicorn</text>
  </g>

  <!-- Redis Cache Strip -->
  <g transform="translate(270, 294)">
    <rect width="260" height="42" rx="7" fill="#0C1F38" stroke="#EF4444" stroke-width="1"/>
    <circle cx="25" cy="21" r="10" fill="#EF4444"/>
    <text x="21" y="25" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="800">R</text>
    <text x="45" y="20" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Redis In-Memory Semantic Cache</text>
    <text x="45" y="34" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9">Session Stores • Token Rate-Limiting</text>
  </g>

  <!-- Security Protocol Strip -->
  <rect x="270" y="346" width="260" height="20" rx="4" fill="#162D4D"/>
  <text x="400" y="360" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Audited JWT / OAuth2 • Zero-Trust Security</text>

  <!-- Flow Connector -->
  <path d="M550 227 L590 227" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="570" cy="227" r="4" fill="#00D2FF"/>

  <!-- Right: PostgreSQL Relational Persistence with Lock & Schema -->
  <rect x="590" y="80" width="180" height="295" rx="10" fill="#071426" stroke="#1B3558"/>
  <text x="680" y="108" fill="#55B9FF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">DATA PERSISTENCE</text>

  <!-- PostgreSQL Database Icon Card -->
  <rect x="605" y="125" width="150" height="110" rx="7" fill="#0C1F38" stroke="#00D2FF" stroke-width="1.2"/>
  <!-- Database 3D Cylinder -->
  <g transform="translate(615, 137)">
    <ellipse cx="16" cy="8" rx="14" ry="5" fill="#162D4D" stroke="#00D2FF" stroke-width="1.2"/>
    <path d="M2 8 v14 c0 3 6.3 5 14 5 s14 -2 14 -5 v-14" fill="#071426" stroke="#00D2FF" stroke-width="1.2"/>
    <path d="M2 15 c0 3 6.3 5 14 5 s14 -2 14 -5" fill="none" stroke="#00D2FF" stroke-width="1"/>
  </g>
  <text x="652" y="152" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">PostgreSQL</text>
  <text x="652" y="168" fill="#00D2FF" font-family="'Inter', sans-serif" font-size="9">Relational DB</text>
  <text x="615" y="195" fill="#10B981" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Row-Level Security (RLS)</text>
  <text x="615" y="212" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8">Normalized ACID Schemas</text>
  <text x="615" y="226" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="8">PgBouncer Pool Active</text>

  <!-- Multi-Tenant SaaS Card -->
  <rect x="605" y="248" width="150" height="112" rx="7" fill="#0C1F38" stroke="#10B981"/>
  <!-- Shield Security Key Icon -->
  <g transform="translate(615, 260)">
    <circle cx="14" cy="14" r="12" fill="#162D4D" stroke="#10B981" stroke-width="1.2"/>
    <path d="M14 6 L20 9 V15 C20 19, 14 22, 14 22 C14 22, 8 19, 8 15 V9 Z" fill="#10B981"/>
  </g>
  <text x="652" y="272" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Tenant Isolation</text>
  <text x="652" y="288" fill="#10B981" font-family="'Inter', sans-serif" font-size="9">Multi-Tenant SaaS</text>
  <text x="615" y="318" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9">Encrypted at Rest (AES-256)</text>
  <text x="615" y="336" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8">Automated Point-in-Time</text>
  <text x="615" y="350" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8">Disaster Recovery Backups</text>

  <!-- Bottom Capability Badges -->
  <rect x="30" y="395" width="740" height="80" rx="8" fill="#071426" stroke="#1B3558"/>
  <text x="50" y="420" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">CORE DIVISION TECHNOLOGIES &amp; PROTOCOLS:</text>

  <rect x="50" y="432" width="130" height="26" rx="5" fill="#0C1F38" stroke="#00D2FF"/>
  <text x="115" y="449" fill="#00D2FF" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Next.js App Router</text>

  <rect x="195" y="432" width="130" height="26" rx="5" fill="#0C1F38" stroke="#F59E0B"/>
  <text x="260" y="449" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">TypeScript Strict</text>

  <rect x="340" y="432" width="130" height="26" rx="5" fill="#0C1F38" stroke="#10B981"/>
  <text x="405" y="449" fill="#10B981" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Python FastAPI</text>

  <rect x="485" y="432" width="130" height="26" rx="5" fill="#0C1F38" stroke="#00D2FF"/>
  <text x="550" y="449" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">PostgreSQL &amp; RLS</text>

  <rect x="630" y="432" width="125" height="26" rx="5" fill="#0C1F38" stroke="#EF4444"/>
  <text x="692" y="449" fill="#EF4444" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Redis Caching</text>
</svg>